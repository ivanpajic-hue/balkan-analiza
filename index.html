const SQL_SCHEMA=`-- BALKAN AVTO DISPEČING — pokrenuti jednom u Supabase SQL Editor-u
create extension if not exists pgcrypto;

create table if not exists public.dispatch_offers (
  id uuid primary key default gen_random_uuid(),
  workspace_id text not null default 'balkan-avto',
  user_id uuid default auth.uid(),
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now(),
  offer_date date not null default current_date,
  reference text,
  client text,
  pickup text not null,
  delivery text not null,
  route_key text,
  loaded_km numeric(12,2) not null default 0,
  empty_km numeric(12,2) not null default 0,
  total_km numeric(12,2) not null default 0,
  revenue_eur numeric(14,2) not null default 0,
  total_cost_eur numeric(14,2) not null default 0,
  profit_eur numeric(14,2) not null default 0,
  margin_percent numeric(8,2) not null default 0,
  price_per_km numeric(10,4) not null default 0,
  decision text not null check (decision in ('accept','negotiate','reject')),
  source text not null default 'manual',
  data jsonb not null default '{}'::jsonb
);

create table if not exists public.dispatch_settings (
  setting_key text primary key,
  workspace_id text not null default 'balkan-avto',
  payload jsonb not null default '{}'::jsonb,
  updated_at timestamptz not null default now()
);

create index if not exists dispatch_offers_date_idx on public.dispatch_offers (offer_date desc);
create index if not exists dispatch_offers_client_idx on public.dispatch_offers (client);
create index if not exists dispatch_offers_route_idx on public.dispatch_offers (route_key);
create index if not exists dispatch_offers_decision_idx on public.dispatch_offers (decision);

alter table public.dispatch_offers enable row level security;
alter table public.dispatch_settings enable row level security;

revoke all on table public.dispatch_offers from anon, authenticated;
revoke all on table public.dispatch_settings from anon, authenticated;
grant select, insert, update, delete on table public.dispatch_offers to authenticated;
grant select, insert, update, delete on table public.dispatch_settings to authenticated;

drop policy if exists "dispatch_authenticated_all" on public.dispatch_offers;
drop policy if exists "settings_authenticated_all" on public.dispatch_settings;
drop policy if exists "dispatch_select" on public.dispatch_offers;
drop policy if exists "dispatch_insert" on public.dispatch_offers;
drop policy if exists "dispatch_update" on public.dispatch_offers;
drop policy if exists "dispatch_delete" on public.dispatch_offers;
create policy "dispatch_select" on public.dispatch_offers for select to authenticated using (true);
create policy "dispatch_insert" on public.dispatch_offers for insert to authenticated with check (true);
create policy "dispatch_update" on public.dispatch_offers for update to authenticated using (true) with check (true);
create policy "dispatch_delete" on public.dispatch_offers for delete to authenticated using (true);

drop policy if exists "settings_select" on public.dispatch_settings;
drop policy if exists "settings_insert" on public.dispatch_settings;
drop policy if exists "settings_update" on public.dispatch_settings;
drop policy if exists "settings_delete" on public.dispatch_settings;
create policy "settings_select" on public.dispatch_settings for select to authenticated using (true);
create policy "settings_insert" on public.dispatch_settings for insert to authenticated with check (true);
create policy "settings_update" on public.dispatch_settings for update to authenticated using (true) with check (true);
create policy "settings_delete" on public.dispatch_settings for delete to authenticated using (true);`;

const num=v=>{if(typeof v==='number')return Number.isFinite(v)?v:0;let s=String(v??'').trim().replace(/\s/g,'');if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');return Number.parseFloat(s.replace(/[^0-9.-]/g,''))||0};
const norm=s=>String(s||'').trim().toLocaleLowerCase('sr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\b(srbija|serbia|hrvatska|croatia|slovenija|slovenia|nemačka|nemacka|germany|italija|italy|austrija|austria|mađarska|madjarska|hungary)\b/g,'').replace(/[^a-z0-9čćžšđ]+/gi,' ').trim();

const median=a=>{if(!a.length)return 0;const s=[...a].sort((x,y)=>x-y);const m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};
const sum=(a,key)=>a.reduce((t,x)=>t+num(typeof key==='function'?key(x):x[key]),0);
const debounce=(fn,ms=220)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}};

class LocalStore{
  constructor(){this.db=null}
  open(){return new Promise((resolve,reject)=>{const r=indexedDB.open('balkan_dispatch_v2',1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('offers'))d.createObjectStore('offers',{keyPath:'id'});if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv',{keyPath:'key'})};r.onsuccess=()=>{this.db=r.result;resolve()};r.onerror=()=>reject(r.error)})}
  tx(store,mode='readonly'){return this.db.transaction(store,mode).objectStore(store)}
  all(store){return new Promise((res,rej)=>{const r=this.tx(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
  get(store,key){return new Promise((res,rej)=>{const r=this.tx(store).get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
  put(store,val){return new Promise((res,rej)=>{const r=this.tx(store,'readwrite').put(val);r.onsuccess=()=>res(val);r.onerror=()=>rej(r.error)})}
  delete(store,key){return new Promise((res,rej)=>{const r=this.tx(store,'readwrite').delete(key);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
}

  settingsMapHtml(s){return `<div class="settings-grid"><div class="card"><div class="card-head"><div><h2>Servis za rute</h2><p class="sub">OSRM je probni režim; OpenRouteService podržava HGV profil i ograničenja vozila.</p></div></div><div class="form-grid"><div class="field w12"><label>Provider</label><select id="map_provider"><option value="osrm" ${s.map_provider==='osrm'?'selected':''}>OSRM — bez ključa, probni režim</option><option value="ors" ${s.map_provider==='ors'?'selected':''}>OpenRouteService — driving-hgv</option></select></div>${this.field('ors_key','OpenRouteService API ključ',s.ors_key,'w12','password','placeholder="unesite ORS token"')}</div><div class="formula-preview">API ključ se čuva lokalno u ovom browseru i ne šalje se u zajedničku SQL konfiguraciju.</div></div><div class="card"><div class="card-head"><div><h2>HGV ograničenja</h2><p class="sub">Unesite stvarne dimenzije i masu autotransportera.</p></div></div><div class="form-grid">${this.setField('hgv_length','Dužina kompozicije','m',s.hgv_length)}${this.setField('hgv_width','Širina','m',s.hgv_width)}${this.setField('hgv_height','Visina','m',s.hgv_height)}${this.setField('hgv_weight','Ukupna masa','t',s.hgv_weight)}${this.setField('hgv_axleload','Maks. osovinsko opterećenje','t',s.hgv_axleload)}</div><p class="warning">Vrednost 0 znači da ograničenje nije zadato. Dobijenu rutu uvek proverite prema realnim propisima, zatvaranjima i operativnim ograničenjima.</p><button class="btn primary" onclick="app.saveMapSettings()">Sačuvaj mapu i HGV profil</button></div></div>`},
  async saveDecisionSettings(){['consumption_loaded','consumption_empty','default_days','target_margin','negotiation_floor','min_profit'].forEach(k=>this.settings[k]=num(document.getElementById(k).value));['base_location','company','workspace_id'].forEach(k=>this.settings[k]=document.getElementById(k).value.trim());if(this.settings.negotiation_floor>this.settings.target_margin){this.toast('Donji prag za pregovor ne može biti veći od ciljne marže.','err');return}if(!this.settings.workspace_id){this.toast('Oznaka radnog prostora je obavezna.','err');return}await this.persistSettings();this.toast('Pravila i parametri su sačuvani.','ok');this.renderSettings('decision')},
  openCostItem(id=''){const item=(this.settings.cost_items||[]).find(x=>x.id===id)||{id:'',name:'',category:'ostalo',type:'fixed_per_offer',rate:0,active:true,mandatory:false,note:''},cats=COST_CATEGORIES.map(x=>`<option value="${esc(x)}" ${x===item.category?'selected':''}>${esc(x)}</option>`).join(''),types=Object.entries(COST_TYPES).map(([k,v])=>`<option value="${k}" ${k===item.type?'selected':''}>${esc(v.label)}</option>`).join('');this.modal(item.id?'Izmena stavke troška':'Nova stavka troška',`<input type="hidden" id="cost_editor_id" value="${esc(item.id)}"><div class="form-grid"><div class="field w8"><label>Naziv stavke</label><input id="cost_name" value="${esc(item.name)}" placeholder="npr. Eurotunel"></div><div class="field w4"><label>Kategorija</label><select id="cost_category">${cats}</select></div><div class="field w8"><label>Način obračuna</label><select id="cost_type" onchange="app.costTypeChanged()">${types}</select></div><div class="field w4"><label>Stopa</label><input id="cost_rate" inputmode="decimal" value="${esc(item.rate)}"></div><div class="field w12"><label>Interna napomena</label><textarea id="cost_note" placeholder="Kada se stavka koristi i šta obuhvata">${esc(item.note||'')}</textarea></div><div class="field w6"><label>Aktivna u obračunu</label><label class="switch"><input id="cost_active" type="checkbox" ${item.active?'checked':''}><i></i></label></div><div class="field w6"><label>Obavezna na proceni</label><label class="switch"><input id="cost_mandatory" type="checkbox" ${item.mandatory?'checked':''}><i></i></label></div></div><div class="formula-preview" id="cost_formula_preview"></div>`,`<button class="btn secondary" onclick="app.closeModal()">Odustani</button><button class="btn primary" onclick="app.saveCostItem()">Sačuvaj stavku</button>`);this.costTypeChanged()},
  costTypeChanged(){const x=COST_TYPES[document.getElementById('cost_type')?.value];if(x)document.getElementById('cost_formula_preview').textContent=`Obračun: stopa u ${x.unit} × ${x.basis}.`},
  async saveCostItem(){const id=document.getElementById('cost_editor_id').value,name=document.getElementById('cost_name').value.trim(),type=document.getElementById('cost_type').value,rate=num(document.getElementById('cost_rate').value);if(!name||!COST_TYPES[type]||rate<0){this.toast('Unesite naziv, način obračuna i nenegativnu stopu.','err');return}const items=this.settings.cost_items||cloneDefaultCosts(),old=items.find(x=>x.id===id),data={id:old?.id||'cost-'+uuid(),name,category:document.getElementById('cost_category').value,type,rate,active:document.getElementById('cost_active').checked,mandatory:document.getElementById('cost_mandatory').checked,note:document.getElementById('cost_note').value.trim(),order:old?.order||Math.max(0,...items.map(x=>num(x.order)))+1};if(old)Object.assign(old,data);else items.push(data);this.settings.cost_items=items;if(data.category==='gorivo'&&data.type==='fuel_formula')this.settings.fuel_price=data.rate;await this.persistSettings();this.closeModal();this.renderSettings('costs');this.toast('Stavka troška je sačuvana.','ok')},
  async updateAdminCostRate(id,value){const x=(this.settings.cost_items||[]).find(y=>y.id===id);if(!x)return;x.rate=Math.max(0,num(value));if(x.category==='gorivo'&&x.type==='fuel_formula')this.settings.fuel_price=x.rate;await this.persistSettings();this.toast(`Stopa „${x.name}” je sačuvana.`,'ok')},
  async toggleCostItem(id,field,checked){const x=(this.settings.cost_items||[]).find(y=>y.id===id);if(!x||!['active','mandatory'].includes(field))return;x[field]=!!checked;await this.persistSettings();this.renderSettings('costs')},
  async moveCostItem(id,dir){const items=(this.settings.cost_items||[]).slice().sort((a,b)=>num(a.order)-num(b.order)),i=items.findIndex(x=>x.id===id),j=i+dir;if(i<0||j<0||j>=items.length)return;[items[i],items[j]]=[items[j],items[i]];items.forEach((x,n)=>x.order=n+1);this.settings.cost_items=items;await this.persistSettings();this.renderSettings('costs')},
  async duplicateCostItem(id){const items=this.settings.cost_items||[],x=items.find(y=>y.id===id);if(!x)return;items.push({...x,id:'cost-'+uuid(),name:x.name+' — kopija',mandatory:false,order:Math.max(0,...items.map(y=>num(y.order)))+1});await this.persistSettings();this.renderSettings('costs');this.toast('Stavka je duplirana.','ok')},

  exportCostConfig(){const blob=new Blob([JSON.stringify({version:1,exported_at:new Date().toISOString(),cost_items:this.settings.cost_items},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Balkan_Avto_troskovi_${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)},
  importCostConfig(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{const parsed=JSON.parse(await input.files[0].text()),raw=Array.isArray(parsed)?parsed:parsed.cost_items;if(!Array.isArray(raw)||!raw.length)throw new Error('Nema stavki');this.settings.cost_items=raw.map((x,i)=>{if(!x.name||!COST_TYPES[x.type])throw new Error(`Neispravna stavka ${i+1}`);return{id:/^[a-z0-9-]+$/i.test(String(x.id||''))?String(x.id):'cost-'+uuid(),name:String(x.name),category:COST_CATEGORIES.includes(x.category)?x.category:'ostalo',type:x.type,rate:Math.max(0,num(x.rate)),active:x.active!==false,mandatory:!!x.mandatory,note:String(x.note||''),order:i+1}});await this.persistSettings();this.renderSettings('costs');this.toast(`Uvezeno ${raw.length} stavki troška.`,'ok')}catch(e){this.toast('Uvoz konfiguracije nije uspeo: '+e.message,'err')}};input.click()},
  sharedSettings(){const keys=['company','base_location','currency','fuel_price','consumption_loaded','consumption_empty','km_cost','daily_fixed','driver_daily','target_margin','negotiation_floor','min_profit','default_days','map_provider','cost_items','hgv_length','hgv_width','hgv_height','hgv_weight','hgv_axleload','workspace_id'];return Object.fromEntries(keys.map(k=>[k,this.settings[k]]))},

  async saveSqlConfig(){const url=document.getElementById('sql_url').value.trim(),key=document.getElementById('sql_anon_key').value.trim();if(!url||!key){this.toast('Unesite Supabase URL i anon ključ.','err');return}this.settings.sql_url=url;this.settings.sql_anon_key=key;await this.store.put('kv',{key:'settings',value:this.settings});await this.connectSql(false);this.renderSettings()},
  async connectSql(silent=false){if(typeof supabase==='undefined'){if(!silent)this.toast('Supabase biblioteka nije učitana. Proverite internet vezu.','err');return}try{this.sql=supabase.createClient(this.settings.sql_url,this.settings.sql_anon_key,{auth:{persistSession:true,autoRefreshToken:true}});const {data,error}=await this.sql.auth.getSession();if(error)throw error;this.sqlSession=data.session;if(this.sqlSession)await this.syncSql();this.updateDbBadge();if(!silent)this.toast(this.sqlSession?'SQL baza je povezana.':'Konfiguracija je sačuvana — prijavite se.','ok')}catch(e){this.sql=null;this.sqlSession=null;this.updateDbBadge();if(!silent)this.toast('Povezivanje nije uspelo: '+e.message,'err')}},
  async signInSql(){if(!this.sql)await this.connectSql(true);const email=document.getElementById('sql_email').value,password=document.getElementById('sql_password').value;const {data,error}=await this.sql.auth.signInWithPassword({email,password});if(error){this.toast(error.message,'err');return}this.sqlSession=data.session;await this.syncSql();this.updateDbBadge();this.renderSettings();this.toast('Uspešno ste prijavljeni.','ok')},
  async signUpSql(){if(!this.sql)await this.connectSql(true);const email=document.getElementById('sql_email').value,password=document.getElementById('sql_password').value;if(password.length<8){this.toast('Lozinka mora imati najmanje 8 karaktera.','err');return}const {error}=await this.sql.auth.signUp({email,password});if(error)this.toast(error.message,'err');else this.toast('Nalog je napravljen. Ako je potvrda emaila uključena, proverite inbox.','ok')},
  async signOutSql(){if(this.sql)await this.sql.auth.signOut();this.sqlSession=null;this.updateDbBadge();this.renderSettings();this.toast('Odjavljeni ste; lokalni režim je i dalje aktivan.','ok')},
  async syncSql(){if(!this.sql||!this.sqlSession)return;this.updateDbBadge('sync');try{const {data,error}=await this.sql.from('dispatch_offers').select('*').eq('workspace_id',this.settings.workspace_id).order('updated_at',{ascending:false});if(error)throw error;const remote=(data||[]).map(x=>this.fromSql(x)),remoteMap=new Map(remote.map(x=>[x.id,x])),merged=new Map(this.offers.map(x=>[x.id,x]));remote.forEach(r=>{const local=merged.get(r.id);if(!local||String(r.updated_at)>String(local.updated_at))merged.set(r.id,r)});this.offers=[...merged.values()];for(const r of this.offers)await this.store.put('offers',r);const toPush=this.offers.filter(x=>!remoteMap.has(x.id)||String(x.updated_at)>String(remoteMap.get(x.id).updated_at));if(toPush.length){const {error:e}=await this.sql.from('dispatch_offers').upsert(toPush.map(x=>this.toSql(x)));if(e)throw e}const {data:st}=await this.sql.from('dispatch_settings').select('payload').eq('setting_key','dispatch_main').maybeSingle();if(st?.payload){this.settings={...this.settings,...st.payload};await this.store.put('kv',{key:'settings',value:this.settings})}this.updateDbBadge();this.toast('SQL baza je sinhronizovana.','ok')}catch(e){this.updateDbBadge('error');this.toast('SQL sinhronizacija nije uspela: '+e.message,'err')}},
  updateDbBadge(mode){const dot=document.getElementById('dbDot'),state=document.getElementById('dbState'),sub=document.getElementById('dbSub');if(mode==='sync'){dot.classList.add('online');state.textContent='Sinhronizacija…';sub.textContent='Povezujem promene';return}if(this.sqlSession){dot.classList.add('online');state.textContent='SQL baza povezana';sub.textContent=this.sqlSession.user?.email||'Supabase PostgreSQL'}else{dot.classList.remove('online');state.textContent='Lokalna baza';sub.textContent=mode==='error'?'SQL veza trenutno nije dostupna':'Podaci su na ovom uređaju'}},
